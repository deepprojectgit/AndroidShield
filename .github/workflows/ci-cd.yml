name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build JVM modules
        run: ./gradlew :android-shield-annotations:build :android-shield-core:build :android-shield-testing:build :android-shield-cli:build --stacktrace

      - name: Build plugin
        run: ./gradlew :android-shield-plugin:build --stacktrace

      - name: Build Android libraries & sample
        run: ./gradlew :android-shield-native:assembleDebug :android-shield-runtime:assembleDebug :sample-app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

  publish:
    name: Publish to Maven Central
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Verify Maven secrets
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          missing=0
          [ -n "$USERNAME" ] || { echo "::error::Missing secret MAVEN_CENTRAL_USERNAME"; missing=1; }
          [ -n "$PASSWORD" ] || { echo "::error::Missing secret MAVEN_CENTRAL_PASSWORD"; missing=1; }
          [ -n "$SIGNING_KEY" ] || { echo "::error::Missing secret SIGNING_KEY"; missing=1; }
          if [ -n "$SIGNING_KEY" ] && ! printf '%s' "$SIGNING_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "::error::SIGNING_KEY must be a full ASCII-armored private key (BEGIN PGP PRIVATE KEY BLOCK)"
            missing=1
          fi
          exit "$missing"

      - name: Publish modules
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          # Gradle PgpKeyId uses signed Long — prefer last 8 hex chars.
          if echo "${SIGNING_KEY_ID:-}" | grep -Eqi '^(0x)?[0-9A-Fa-f]{16}$'; then
            RAW=$(echo "$SIGNING_KEY_ID" | sed -E 's/^0x//I')
            export ORG_GRADLE_PROJECT_signingInMemoryKeyId="${RAW: -8}"
            echo "Using short SIGNING_KEY_ID=${ORG_GRADLE_PROJECT_signingInMemoryKeyId}"
          elif echo "${SIGNING_KEY_ID:-}" | grep -Eqi '^(0x)?[0-9A-Fa-f]{8}$'; then
            export ORG_GRADLE_PROJECT_signingInMemoryKeyId="$SIGNING_KEY_ID"
          fi
          ./gradlew \
            :android-shield-annotations:publishToMavenCentral \
            :android-shield-core:publishToMavenCentral \
            :android-shield-native:publishToMavenCentral \
            :android-shield-runtime:publishToMavenCentral \
            :android-shield-plugin:publishToMavenCentral \
            :android-shield-cli:publishToMavenCentral \
            --no-configuration-cache \
            --stacktrace
