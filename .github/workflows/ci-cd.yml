name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build JVM modules
        run: ./gradlew :android-shield-annotations:build :android-shield-core:build :android-shield-testing:build :android-shield-cli:build --stacktrace

      - name: Build plugin
        run: ./gradlew :android-shield-plugin:build --stacktrace

      - name: Build Android libraries & sample
        run: ./gradlew :android-shield-native:assembleDebug :android-shield-runtime:assembleDebug :sample-app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

  publish:
    name: Publish to Maven Central
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Verify Maven secrets
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          missing=0
          [ -n "$USERNAME" ] || { echo "::error::Missing secret MAVEN_CENTRAL_USERNAME"; missing=1; }
          [ -n "$PASSWORD" ] || { echo "::error::Missing secret MAVEN_CENTRAL_PASSWORD"; missing=1; }
          [ -n "$SIGNING_KEY" ] || { echo "::error::Missing secret SIGNING_KEY"; missing=1; }
          exit "$missing"

      - name: Publish modules
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >
          ./gradlew
          :android-shield-annotations:publishToMavenCentral
          :android-shield-core:publishToMavenCentral
          :android-shield-native:publishToMavenCentral
          :android-shield-runtime:publishToMavenCentral
          :android-shield-plugin:publishToMavenCentral
          :android-shield-cli:publishToMavenCentral
          --no-configuration-cache
          --stacktrace
